[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-checkout"
version = "0.1.0"
description = "Policy-guarded Solana stablecoin checkout agent built with Google ADK and Gemini."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk==2.6.1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "solana==0.40.1",
  "solders==0.28.0",
  "uvicorn[standard]>=0.35,<1",
  "zxing-cpp==3.1.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-tools>=7.5,<8",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apps", "packages"]
